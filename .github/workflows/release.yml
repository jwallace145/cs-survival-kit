# Release pipeline. On every push to main, Release Please maintains a running
# release PR built from Conventional Commits. Merging that PR bumps the version
# in pyproject.toml, updates CHANGELOG.md, tags vX.Y.Z and creates the GitHub
# Release. The remaining jobs run only for that merge: build the tag, publish
# it to PyPI, and tell the guide repo that a new version exists.
name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
      html_url: ${{ steps.release.outputs.html_url }}
    steps:
      # An App token rather than GITHUB_TOKEN: PRs opened with GITHUB_TOKEN do
      # not trigger workflows, so CI would never run on the release PR.
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: astral-sh/setup-uv@v10.2.0  # no moving major tag is published
      - run: uv build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: [release-please, build]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/cs-survival-kit/${{ needs.release-please.outputs.version }}/
    permissions:
      id-token: write  # trusted publishing; no API token is stored anywhere
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  attach-to-release:
    needs: [release-please, build, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - run: gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}

  notify-guide:
    needs: [release-please, publish]
    runs-on: ubuntu-latest
    steps:
      # GITHUB_TOKEN cannot dispatch events to another repository.
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: jwallace145
          repositories: cs-survival-guide
      - name: Send kit-released to cs-survival-guide
        run: |
          gh api repos/jwallace145/cs-survival-guide/dispatches \
            -f "event_type=kit-released" \
            -f "client_payload[version]=$VERSION" \
            -f "client_payload[tag]=$TAG" \
            -f "client_payload[release_url]=$RELEASE_URL"
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          VERSION: ${{ needs.release-please.outputs.version }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
          RELEASE_URL: ${{ needs.release-please.outputs.html_url }}
